name: FetchFrame
options:
  bundleIdPrefix: com.sarveshroshan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # Your Apple developer team. Change it, and the bundle IDs below, to sign with another account.
    DEVELOPMENT_TEAM: 4KRCPQBFXY
targets:
  FetchFrame:
    type: application
    platform: iOS
    sources:
      - path: FetchFrame
        excludes:
          - "Python/**"
      - path: FetchFrame/Python/app
        type: folder
        buildPhase: resources
      - path: FetchFrame/Python/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: vendor/Python.xcframework
        embed: true
        codeSign: true
      - framework: vendor/FFmpeg.xcframework
        embed: false
      - target: ShareExtension
        embed: true
      - sdk: JavaScriptCore.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: Photos.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarveshroshan.fetchframe
        SWIFT_OBJC_BRIDGING_HEADER: FetchFrame/FetchFrame-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FetchFrame/Info.plist
      properties:
        CFBundleDisplayName: FetchFrame
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.sarveshroshan.fetchframe
            CFBundleURLSchemes:
              - fetchframe
        # These two make downloads appear in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: FetchFrame saves the videos you download to your photo library.
    postCompileScripts:
      - name: Install Python standard library
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # These aren't kept in Git; without yt-dlp the app would build but fail on first use.
          if [ ! -f "$PROJECT_DIR/FetchFrame/Python/app_packages/yt_dlp/__init__.py" ] ||
             [ ! -d "$PROJECT_DIR/vendor/Python.xcframework" ]; then
            echo "error: Downloaded files are missing. Run ios/scripts/setup-vendor.sh, then build again."
            exit 1
          fi
          source "$PROJECT_DIR/vendor/Python.xcframework/build/utils.sh"
          install_python vendor/Python.xcframework app app_packages
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarveshroshan.fetchframe.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: FetchFrame
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
schemes:
  FetchFrame:
    build:
      targets:
        FetchFrame: all
        ShareExtension: all
    run:
      config: Debug
